apply plugin: 'com.android.application'

android {
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
        }
    }
    useLibrary 'org.apache.http.legacy'

compileSdkVersion 35
//buildToolsVersion "33.0.3"
    defaultConfig {
        applicationId "com.baidu.mapclient.liteapp"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 53
        versionName "1.2.24"

        multiDexEnabled true

    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    namespace 'com.baidu.mapclient.liteapp'
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "SiFli-PreviewNav" // 替换为你的应用名称
            def versionName = variant.versionName
            def buildType = variant.buildType.name
            outputFileName = "${appName}-${buildType}-${versionName}.apk"
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation 'com.airbnb.android:lottie:3.6.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.4.30'
    implementation 'com.github.bumptech.glide:glide:4.12.0'

    implementation (name: 'onsdk_all', ext:'aar')
    implementation (name: 'NaviTts', ext:'aar')
    implementation (name: 'siflicore-release', ext:'aar')
    implementation (name: 'sifliotasdk-release', ext:'aar')
    implementation (name: 'sifliimagelib-release', ext:'aar')
    implementation (name: 'ezip-release', ext:'aar')
    implementation("com.madgag.spongycastle:core:1.58.0.0")
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'com.github.naman14:TAndroidLame:1.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bingoogolapple.BGAQRCode-Android:zxing:1.3.8'

    implementation 'com.kaopiz:kprogresshud:1.2.0'

}